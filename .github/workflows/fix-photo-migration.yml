name: Remove obsolete photo migration UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-photo-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete migration UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/web-app.js')
          text = path.read_text(encoding='utf-8')
          original = text

          # Remove only the obsolete Telegram photo migration styles.
          text, count = re.subn(
              r'\.photo-migration-card\{.*?\}\n\.photo-migration-card h3\{.*?\}\n\.photo-migration-card p\{.*?\}\n\.photo-migration-card \\.btn\{.*?\}\n\.photo-migration-status\{.*?\}\n',
              '', text, count=1, flags=re.S
          )

          # Remove the migration function, leaving the visit-details function intact.
          text, function_count = re.subn(
              r'\n  async function renderPhotoMigrationControls\(\) \{.*?\n  \}\n\n  function visitDetailsHtml',
              '\n  function visitDetailsHtml', text, count=1, flags=re.S
          )

          text = text.replace('      \'<div id="photo-migration-slot"></div>\' +\n', '')
          text = text.replace('\n    renderPhotoMigrationControls();\n', '\n')

          if function_count != 1:
              raise SystemExit('Expected photo migration function was not found.')
          if 'photo-migration' in text or 'renderPhotoMigrationControls' in text:
              raise SystemExit('Obsolete photo migration references remain.')
          if text == original:
              raise SystemExit('No changes were made.')

          path.write_text(text, encoding='utf-8')

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-app.js
          git rm .github/workflows/fix-photo-migration.yml
          git commit -m 'Remove obsolete Telegram photo migration UI'
          git push
